services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fairytale
      POSTGRES_USER: fairytale
      POSTGRES_PASSWORD: fairytale
    ports: ['127.0.0.1:55439:5432']
    volumes: ['postgres:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fairytale']
      interval: 3s
      retries: 20
volumes:
  postgres:
